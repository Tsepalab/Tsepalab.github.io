<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Цветная таблица</title>
    <style>
        table {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            border-collapse: collapse;
        }

        td {
            border: 2px solid black;
            width: 50px;
            height: 50px;
        }

        .cyan {
            background-color: #64FFDA;
        }

        .pale-yellow {
            background-color: #FFFFCC;
        }

        .red {
            background-color: #FF0000;
        }

        .blue {
            background-color: #0000FF;
        }

        .green {
            background-color: #00FF00;
        }

        .yellow {
            background-color: #FFFF00;
        }
    </style>
</head>

<body>
    <header class="back-bar">
        <nav>
            <a href="index.html#tasks">К заданиям</a>
        </nav>
    </header>
    <table>
        <tr>
            <td colspan="8" class="cyan"></td>
        </tr>

        <tr>
            <td rowspan="6" class="pale-yellow"></td>
            <td colspan="6" class="cyan"></td>
            <td rowspan="6" class="pale-yellow"></td>
        </tr>

        <tr>
            <td rowspan="4" class="pale-yellow"></td>
            <td colspan="4" class="cyan"></td>
            <td rowspan="4" class="pale-yellow"></td>
        </tr>

        <tr>
            <td rowspan="2" class="pale-yellow"></td>
            <td class="red"></td>
            <td class="blue"></td>
            <td rowspan="2" class="pale-yellow"></td>
        </tr>

        <tr>
            <td class="green"></td>
            <td class="yellow"></td>
        </tr>

        <tr>
            <td colspan="4" class="cyan"></td>
        </tr>

        <tr>
            <td colspan="6" class="cyan"></td>
        </tr>

        <tr>
            <td colspan="8" class="cyan"></td>
        </tr>
    </table>
</body>

</html>
