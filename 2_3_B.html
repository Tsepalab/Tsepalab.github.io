<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Пример формы регистрации сайта</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            color: #000;
            margin: 20px;
        }

        h2 {
            font-weight: normal;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 2px;
            font-size: 15px;
        }

        input[type="text"],
        input[type="password"],
        select,
        textarea {
            border: 1px solid #999;
            padding: 2px;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        input[type="text"],
        input[type="password"] {
            width: 160px;
        }

        select {
            width: 170px;
        }

        textarea {
            width: 420px;
            height: 180px;
            resize: both;
        }

        .buttons {
            margin-top: 15px;
        }

        input[type="reset"],
        input[type="submit"] {
            background-color: #e6e6e6;
            border: 1px solid #5b7b9c;
            color: #2b579a;
            padding: 3px 8px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            cursor: pointer;
            margin-right: 5px;
        }

        input[type="reset"]:hover,
        input[type="submit"]:hover {
            background-color: #d4d4d4;
        }
    </style>
</head>

<body>
    <header class="back-bar">
        <nav>
            <a href="index.html#tasks">К заданиям</a>
        </nav>
    </header>

    <h2>Пример формы регистрации сайта</h2>

    <form action="#" method="post" enctype="multipart/form-data">

        <div class="form-group">
            <label>Логин:</label>
            <input type="text" id="login">
        </div>

        <div class="form-group">
            <label>Пароль:</label>
            <input type="password" id="password">
        </div>

        <div class="form-group">
            <label>URL-адрес сайта:</label>
            <input type="text" id="url" value="http://">
        </div>

        <div class="form-group">
            <label>Название сайта:</label>
            <input type="text" id="sitename">
        </div>

        <div class="form-group">
            <label>Описание сайта:</label>
            <textarea id="description"></textarea>
        </div>

        <div class="form-group">
            <label>Тема сайта:</label>
            <select id="theme">
                <option value="">Тема не выбрана</option>
                <option value="business">Бизнес</option>
                <option value="it">IT и технологии</option>
                <option value="news">Новости</option>
            </select>
        </div>

        <div class="form-group">
            <label>Баннер 88x31:</label>
            <input type="file" id="banner">
        </div>

        <div class="buttons">
            <input type="reset" value="Очистить">
            <input type="submit" value="Отправить">
        </div>

    </form>
</body>

</html>
